<script type="module">
/* ============================================================
   1) 설정
   Firebase 값을 넣으면 실시간 공유, 비워두면(YOUR_ 상태) "데모 모드"(이 브라우저에만 저장)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAlkvGNSdTIj6P4TwSMnPeFYSYxDBrz8BU",
  authDomain: "apic-6244b.firebaseapp.com",
  projectId: "apic-6244b",
  appId: "1:95470777162:web:24aa96229015f9de7cc7b3"
};

const TITLE = "APIC 실험실 장비예약";
const ADMIN_CODE = "9999";          // 관리자 모드 진입 코드
const REPAIR = "수리중";            // 수리 예약 표시 이름
const DEFAULT_TABS = [
  ...["SEM","폴리셔","오토폴리셔","멀티프랩","스크린프린터","대기리플로우","저속전단","고속전단","LAB","진공리플로우","플립칩본더","웨이퍼본더"].map(name=>({name})),
  { name:"신뢰성방", type:"room", cols:["열충격1호","열충격2호","열충격3호","열사이클","항온항습"].map((n,i)=>({id:'c'+i,name:n})) },
];
const HOURS = Array.from({length:15},(_,i)=>9+i);   // 9~10시 ... 23~24시
const DEFAULT_LIMIT = 20;                           // 1인당 장비(탭)별 기본 예약 한도(시간)
const LIMIT_MIN = 5, LIMIT_MAX = 40, LIMIT_STEP = 5; // 관리자 설정 범위: 5~40시간, 5시간 단위
const DAYS = 22;                                    // 오늘 포함 22일(3주+1일)
const stepOf = t => (t && +t.step===30) ? 30 : 60;  // 예약 간격(분): 기본 60, 탭별로 30분 선택 가능
const slotH = t => stepOf(t)/60;                    // 한 칸의 시간(1 또는 0.5)
const hourLabel = h => h<24 ? `${h}~${h+1}시` : `익일 ${h-24}~${h-23}시`;
const halfLabel = h => { const H=Math.floor(h), M=h%1?'30':'00'; return H>=24 ? `익${H-24}:${M}` : `${H}:${M}`; };
const clock = h => `${Math.floor(h)%24}:${h%1?'30':'00'}`;
const slotText = (hr,st) => st===30 ? `${clock(hr)}~${clock(hr+0.5)}` : hourLabel(hr);
const fmtH = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const hoursFor = t => {
  const n=Math.max(0,Math.min(9,+(t&&t.extra)||0)), base=[...HOURS,...Array.from({length:n},(_,i)=>24+i)];
  return stepOf(t)===30 ? base.flatMap(h=>[h,h+0.5]) : base;
};
const slotRange = (t,lo,hi) => hoursFor(t).filter(h=>h>=lo&&h<=hi);
const limitOpts = sel => { let o=''; for(let v=LIMIT_MIN;v<=LIMIT_MAX;v+=LIMIT_STEP) o+=`<option value="${v}"${v===sel?' selected':''}>${v}시간</option>`; return o; };
const stepOpts = sel => `<option value="60"${sel===60?' selected':''}>1시간</option><option value="30"${sel===30?' selected':''}>30분</option>`;
const extraLabel = n => n===0 ? '23~24시까지 (기본)' : `익일 ${n-1}~${n}시까지`;
const extraOpts = sel => [...Array(10).keys()].map(n=>`<option value="${n}"${n===sel?' selected':''}>${extraLabel(n)}</option>`).join('');
const USE_FIREBASE = !!firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");
const PIN_RE = /^\d{4}$/;

/* ---------------- 유틸 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ROLL_HOUR = 9;                                   // 다음날 9시에 맨 윗줄(전날)이 삭제됨
const bizToday = () => ymd(new Date(Date.now() - ROLL_HOUR*3600000));
const DOW = ['일','월','화','수','목','금','토'];
const parseYmd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const label = s => { const d=parseYmd(s); return `${String(d.getFullYear()).slice(2)}/${pad(d.getMonth()+1)}/${pad(d.getDate())} (${DOW[d.getDay()]})`; };
const shortDate = s => s ? `${s.slice(2,4)}.${s.slice(5,7)}.${s.slice(8,10)}` : '';
const seedTabs = () => DEFAULT_TABS.map((d,i)=>({id:'t'+i,name:d.name,order:i,type:d.type||'grid',cols:JSON.parse(JSON.stringify(d.cols||[]))}));

async function hashPin(name, pin){
  const s = `${name}::${pin}`;
  if (window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'x'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}

function makeLocalStore(){
  const KEY='eqres_demo_v2';
  const subs=new Set();
  const load=()=>{ try{return JSON.parse(localStorage.getItem(KEY))}catch{return null} };
  let db = load() || { ver:3, tabs:seedTabs(), users:{}, res:{}, rooms:{} };
  if(!db.rooms) db.rooms={};
  if(!db.fac) db.fac=[];
  if((db.ver||2)<3){            // 이전 데모 데이터에 새 기본 탭 추가
    DEFAULT_TABS.forEach((d,i)=>{ if(i>=11 && !db.tabs.find(t=>t.name===d.name)) db.tabs.push(seedTabs()[i]); });
    db.ver=3; localStorage.setItem(KEY,JSON.stringify(db));
  }
  const emit=()=>subs.forEach(f=>f());
  const save=()=>{ localStorage.setItem(KEY,JSON.stringify(db)); emit(); };
  window.addEventListener('storage',e=>{ if(e.key===KEY){ db=load()||db; emit(); } });
  const watch=(getter,cb)=>{ const f=()=>cb(getter()); subs.add(f); f(); return ()=>subs.delete(f); };
  const roomsOf=tabId=>(db.rooms[tabId]=db.rooms[tabId]||{});
  return {
    mode:'demo',
    async initIfNeeded(){},
    watchTabs:cb=>watch(()=>[...db.tabs].sort((a,b)=>a.order-b.order),cb),
    async addTab(name,type){ db.tabs.push({id:'t'+Date.now(),name,order:Date.now(),type:type||'grid',cols:[]}); save(); },
    async renameTab(id,name){ const t=db.tabs.find(x=>x.id===id); if(t){t.name=name;save();} },
    async setCols(id,cols){ const t=db.tabs.find(x=>x.id===id); if(t){t.cols=cols;save();} },
    async reorderTabs(list){ list.forEach(u=>{ const t=db.tabs.find(x=>x.id===u.id); if(t) t.order=u.order; }); save(); },
    async setTabExtra(id,n){ const t=db.tabs.find(x=>x.id===id); if(t){t.extra=n;save();} },
    async setTabLimit(id,n){ const t=db.tabs.find(x=>x.id===id); if(t){t.limit=n;save();} },
    async setTabStep(id,n){ const t=db.tabs.find(x=>x.id===id); if(t){t.step=n;save();} },
    async listRes(tabId,from){ return Object.values(db.res[tabId]||{}).filter(r=>r.date>=from).map(r=>({...r})); },
    async applyStepDown(tabId,plan){          // 30분 → 1시간: 정각 칸이 비어 있으면 30분 예약을 올리고, 아니면 삭제
      const o=db.res[tabId]=db.res[tabId]||{};
      plan.del.forEach(r=>{ delete o[r.date+'_'+r.hour]; });
      plan.move.forEach(r=>{ const b=Math.floor(r.hour); delete o[r.date+'_'+r.hour]; o[r.date+'_'+b]={date:r.date,hour:b,name:r.name}; });
      const t=db.tabs.find(x=>x.id===tabId); if(t) t.step=60; save();
    },
    watchFac:cb=>watch(()=>[...db.fac],cb),
    async facTx(fn){ db.fac=fn(db.fac.map(x=>({...x})))||[]; save(); },
    async setTabNotice(id,text){ const t=db.tabs.find(x=>x.id===id); if(t){t.notice=text;save();} },
    watchNotice:cb=>watch(()=>db.notice||'',cb),
    async setNotice(text){ db.notice=text; save(); },
    async deleteTab(id){ db.tabs=db.tabs.filter(t=>t.id!==id); delete db.res[id]; delete db.rooms[id]; save(); },
    watchRes:(tabId,from,cb)=>watch(()=>Object.values(db.res[tabId]||{}).filter(r=>r.date>=from),cb),
    async reserve(tabId,date,hour,name){
      const k=date+'_'+hour; db.res[tabId]=db.res[tabId]||{};
      if(db.res[tabId][k]) throw new Error('taken');
      db.res[tabId][k]={date,hour,name}; save();
    },
    async cancel(tabId,date,hour){ if(db.res[tabId]){ delete db.res[tabId][date+'_'+hour]; save(); } },
    watchRoom:(tabId,cb)=>watch(()=>new Map(Object.entries(db.rooms[tabId]||{})),cb),
    async roomReserve(tabId,colId,name){
      const o=roomsOf(tabId); if(o[colId]&&o[colId].user) throw new Error('taken');
      o[colId]={...(o[colId]||{}),user:name,start:'',end:''}; save();
    },
    async roomRelease(tabId,colId){ if(db.rooms[tabId]){ delete db.rooms[tabId][colId]; save(); } },
    async roomSet(tabId,colId,f){ const o=roomsOf(tabId); o[colId]={...(o[colId]||{}),...f}; save(); },
    async getUser(name){ return db.users[name]||null; },
    async countUsers(){ return Object.keys(db.users).length; },
    watchUsers:cb=>watch(()=>Object.values(db.users),cb),
    async setUser(u){ db.users[u.name]=u; save(); },
    async createUser(u){ if(db.users[u.name]) throw new Error('exists'); db.users[u.name]=u; save(); },
    async deleteUser(name){ delete db.users[name]; save(); },
  };
}

async function makeFirebaseStore(){
  const V='10.14.1';
  const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const {collection,doc,getDoc,getDocs,setDoc,deleteDoc,onSnapshot,query,where,orderBy,limit,runTransaction,writeBatch,addDoc,updateDoc} = fs;
  const app = appMod.initializeApp(firebaseConfig);
  const db = fs.getFirestore(app);
  const resCol = tabId => collection(db,'equipments',tabId,'reservations');
  const roomCol = tabId => collection(db,'equipments',tabId,'rooms');
  const wipe = async col=>{
    const snap=await getDocs(col);
    for(let i=0;i<snap.docs.length;i+=400){ const b=writeBatch(db); snap.docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit(); }
  };
  return {
    mode:'firebase',
    async initIfNeeded(){   // 최초 1회 기본 장비 탭 생성
      const m = doc(db,'meta','init');
      if((await getDoc(m)).exists()) return;
      const b = writeBatch(db);
      DEFAULT_TABS.forEach((d,i)=>b.set(doc(db,'equipments','eq_'+i),{name:d.name,order:i,type:d.type||'grid',cols:d.cols||[]}));
      b.set(m,{at:Date.now()});
      await b.commit();
    },
    watchTabs:cb=>onSnapshot(query(collection(db,'equipments'),orderBy('order')),
      s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>toast('탭 불러오기 실패: '+e.message)),
    async addTab(name,type){ await addDoc(collection(db,'equipments'),{name,order:Date.now(),type:type||'grid',cols:[]}); },
    async renameTab(id,name){ await updateDoc(doc(db,'equipments',id),{name}); },
    async setCols(id,cols){ await updateDoc(doc(db,'equipments',id),{cols}); },
    async reorderTabs(list){ const b=writeBatch(db); list.forEach(u=>b.update(doc(db,'equipments',u.id),{order:u.order})); await b.commit(); },
    async setTabExtra(id,n){ await updateDoc(doc(db,'equipments',id),{extra:n}); },
    async setTabLimit(id,n){ await updateDoc(doc(db,'equipments',id),{limit:n}); },
    async setTabStep(id,n){ await updateDoc(doc(db,'equipments',id),{step:n}); },
    async listRes(tabId,from){ return (await getDocs(query(resCol(tabId),where('date','>=',from)))).docs.map(d=>d.data()); },
    async applyStepDown(tabId,plan){          // 30분 → 1시간: 정각 칸이 비어 있으면 30분 예약을 올리고, 아니면 삭제
      const R=(date,hour)=>doc(db,'equipments',tabId,'reservations',`${date}_${hour}`), ops=[];
      plan.del.forEach(r=>ops.push(b=>b.delete(R(r.date,r.hour))));
      plan.move.forEach(r=>{ const h0=Math.floor(r.hour);
        ops.push(b=>b.set(R(r.date,h0),{date:r.date,hour:h0,name:r.name,createdAt:Date.now()}));
        ops.push(b=>b.delete(R(r.date,r.hour))); });
      for(let i=0;i<ops.length;i+=400){ const b=writeBatch(db); ops.slice(i,i+400).forEach(f=>f(b)); await b.commit(); }
      await updateDoc(doc(db,'equipments',tabId),{step:60});
    },
    watchFac:cb=>onSnapshot(doc(db,'meta','facilities'),s=>cb(s.exists()?(s.data().items||[]):[]),e=>toast('장비 관리 불러오기 실패: '+e.message)),
    async facTx(fn){                          // 읽고-수정-쓰기를 한 번에 (동시에 눌러도 서로 덮어쓰지 않음)
      const ref=doc(db,'meta','facilities');
      await runTransaction(db,async tx=>{
        const s=await tx.get(ref), items=s.exists()?(s.data().items||[]):[];
        tx.set(ref,{items:fn(items.map(x=>({...x}))),at:Date.now()});
      });
    },
    async setTabNotice(id,text){ await updateDoc(doc(db,'equipments',id),{notice:text}); },
    watchNotice:cb=>onSnapshot(doc(db,'meta','notice'),s=>cb(s.exists()?(s.data().text||''):''),()=>{}),
    async setNotice(text){ await setDoc(doc(db,'meta','notice'),{text,at:Date.now()}); },
    async deleteTab(id){ await wipe(resCol(id)); await wipe(roomCol(id)); await deleteDoc(doc(db,'equipments',id)); },
    watchRes:(tabId,from,cb)=>onSnapshot(query(resCol(tabId),where('date','>=',from)),
      s=>cb(s.docs.map(d=>d.data())), e=>toast('예약 불러오기 실패: '+e.message)),
    async reserve(tabId,date,hour,name){
      const ref=doc(db,'equipments',tabId,'reservations',`${date}_${hour}`);
      await runTransaction(db,async tx=>{
        if((await tx.get(ref)).exists()) throw new Error('taken');
        tx.set(ref,{date,hour,name,createdAt:Date.now()});
      });
    },
    async cancel(tabId,date,hour){ await deleteDoc(doc(db,'equipments',tabId,'reservations',`${date}_${hour}`)); },
    watchRoom:(tabId,cb)=>onSnapshot(roomCol(tabId),
      s=>cb(new Map(s.docs.map(d=>[d.id,d.data()]))), e=>toast('불러오기 실패: '+e.message)),
    async roomReserve(tabId,colId,name){
      const ref=doc(db,'equipments',tabId,'rooms',colId);
      await runTransaction(db,async tx=>{
        const s=await tx.get(ref);
        if(s.exists()&&s.data().user) throw new Error('taken');
        tx.set(ref,{user:name,start:'',end:''},{merge:true});
      });
    },
    async roomRelease(tabId,colId){ await deleteDoc(doc(db,'equipments',tabId,'rooms',colId)); },
    async roomSet(tabId,colId,f){ await setDoc(doc(db,'equipments',tabId,'rooms',colId),f,{merge:true}); },
    async getUser(name){ const s=await getDoc(doc(db,'users',name)); return s.exists()?s.data():null; },
    async countUsers(){ return (await getDocs(query(collection(db,'users'),limit(1)))).size; },
    watchUsers:cb=>onSnapshot(collection(db,'users'),s=>cb(s.docs.map(d=>d.data()))),
    async setUser(u){ await setDoc(doc(db,'users',u.name),u); },
    async createUser(u){
      const ref=doc(db,'users',u.name);
      await runTransaction(db,async tx=>{ if((await tx.get(ref)).exists()) throw new Error('exists'); tx.set(ref,u); });
    },
    async deleteUser(name){ await deleteDoc(doc(db,'users',name)); },
  };
}

const state = {
  store:null, user:null, tabs:[], activeTab:localStorage.getItem('eqres_tab')||null,
  res:new Map(), room:new Map(), today:bizToday(), hour:0,
  unsubRes:null, unsubUsers:null, subKey:'', users:[], panelOpen:false, colEdit:null,
  repair:false, pending:false, notice:'',
  adminMode:false,
  view:'res', fac:[], scrollKey:'', savedScroll:null,   // view: 'res'(장비예약) / 'fac'(장비 관리)
};
const slotTick = () => { const n=new Date(); return n.getHours()*2+(n.getMinutes()>=30?1:0); };   // 30분마다 바뀌는 값
state.hour = slotTick();
const isAdmin = () => state.adminMode;
const curTab = () => state.tabs.find(t=>t.id===state.activeTab);
const isRoom = t => t && t.type==='room';
const isPastSlot = (date,hr,st) => {           // 지난 시간(현재 칸은 예약 가능), 24시 이후 열은 다음 날 새벽으로 계산
  const step=st||stepOf(curTab());
  const [y,m,d]=date.split('-').map(Number), n=new Date(); n.setMinutes(step===30&&n.getMinutes()>=30?30:0,0,0);
  const H=Math.floor(hr), M=Math.round((hr-H)*60);
  return new Date(y,m-1,d,H,M).getTime() < n.getTime();
};
const limitOf = t => {           // 1인 한도(시간): 5~40, 5시간 단위로 보정 (예전 값·0은 기본 20시간)
  const v=+(t&&t.limit); if(!isFinite(v)||v<=0) return DEFAULT_LIMIT;
  return Math.max(LIMIT_MIN,Math.min(LIMIT_MAX,Math.round(v/LIMIT_STEP)*LIMIT_STEP));
};
function myUsed(){               // 이 장비에서 내가 잡은 시간(지난 칸 제외, 30분 칸은 0.5시간)
  let n=0; for(const r of state.res.values()) if(state.user&&r.name===state.user.name&&!isPastSlot(r.date,r.hour)) n++;
  return n*slotH(curTab());
}
function quotaLeft(){            // 이 장비에서 내가 더 예약할 수 있는 시간 (수리 예약은 한도 제외)
  const tab=curTab(), limit=limitOf(tab), repair=isAdmin()&&state.repair, sh=slotH(tab);
  if(repair||isRoom(tab)) return {left:Infinity,limit,name:tab?tab.name:'',sh};
  return {left:limit-myUsed(),limit,name:tab?tab.name:'',sh};
}

const SESS='eqres_session';
function saveSession(u){ localStorage.setItem(SESS,JSON.stringify({name:u.name,hash:u.pinHash})); }

async function verify(){
  if(!state.user) return false;
  try{
    const u=await state.store.getUser(state.user.name);
    if(!u || u.pinHash!==state.user.pinHash){ logout('계정 정보가 변경되어 로그아웃되었습니다'); return false; }
    if(!!u.admin!==state.adminMode){           // 다른 기기에서 관리자 모드를 켜거나 끈 경우 반영
      state.user=u; state.adminMode=!!u.admin; if(!u.admin) state.repair=false;
      syncHeader(); renderTabs(); renderGrid(); renderFac(); if(state.panelOpen) renderPanel();
    }
    return true;
  }catch(e){ toast('서버 확인 실패: '+e.message); return false; }
}

function logout(msg){
  localStorage.removeItem(SESS);
  state.unsubRes&&state.unsubRes(); state.unsubRes=null; state.subKey=''; state.res=new Map(); state.room=new Map();
  state.user=null; state.adminMode=false; state.repair=false; sessionStorage.removeItem('eqres_admin');
  closePanel(); showLogin();
  if(msg) toast(msg);
}

function syncHeader(){
  const n=$('#whoName'); if(n&&state.user) n.innerHTML=esc(state.user.name)+(isAdmin()?'<span class="admtag"> · 관리자 모드</span>':'');
  const b=$('#btnRepair'); if(b){ b.disabled=!isAdmin(); b.classList.toggle('on',isAdmin()&&state.repair); }
  const h=$('#help'); if(h){ $('#helpTxt').textContent=helpText(); h.classList.toggle('rep',isAdmin()&&state.repair); }
  const qe=$('#quota'); if(qe){
    const tab=curTab(), lim=limitOf(tab);
    if(!tab||isRoom(tab)||!state.user){ qe.textContent=''; }
    else{ const u=myUsed(); qe.textContent=`내 예약 ${fmtH(u)}/${lim}시간`; qe.classList.toggle('full',u>=lim-1e-9); }
  }
}

function startApp(){ state.view='res'; state.scrollKey=''; renderShell(); state.subKey=''; subscribeRes(); }

function onTabs(tabs){
  state.tabs=tabs;
  if(!tabs.find(t=>t.id===state.activeTab)) state.activeTab=tabs[0]?tabs[0].id:null;
  if(state.user){ renderTabs(); subscribeRes(); renderGrid(); }
  if(state.panelOpen&&isAdmin()) renderTabList();
}

function subscribeRes(){
  if(!state.user) return;
  const tab=curTab(), kind=isRoom(tab)?'room':'grid';
  const key=`${state.activeTab}|${state.today}|${kind}`;
  if(key===state.subKey) return;
  state.subKey=key;
  state.unsubRes&&state.unsubRes(); state.unsubRes=null; state.res=new Map(); state.room=new Map();
  if(!tab) return;
  state.unsubRes = kind==='room'
    ? state.store.watchRoom(tab.id,m=>{ state.room=m; renderGrid(); })
    : state.store.watchRes(tab.id,state.today,list=>{ state.res=new Map(list.map(r=>[`${r.date}_${r.hour}`,r])); renderGrid(); });
}

function renderTabs(){
  const el=$('#tabs'); if(!el) return;
  el.innerHTML=(isAdmin()?'<button class="add" data-act="add" title="장비 탭 추가">＋</button>':'')+
    state.tabs.map(t=>`<button data-id="${t.id}" class="${t.id===state.activeTab?'active':''}">${esc(t.name)}</button>`).join('');
  el.onclick=async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.act==='add'){ const n=(prompt('추가할 장비 이름')||'').trim(); if(n) await state.store.addTab(n,'grid').catch(er=>toast(er.message)); return; }
    state.activeTab=b.dataset.id; localStorage.setItem('eqres_tab',state.activeTab);
    renderTabs(); subscribeRes(); renderGrid();
  };
}

/* ---------------- 그리드 렌더 ---------------- */
let drag=null, tap=null, lastTouchTap=0;
const clearSel=()=>document.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel'));
const isEditing=()=>{ const a=document.activeElement, w=$('#gridwrap'); return !!(a&&w&&w.contains(a)&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')); };

function renderGrid(){
  const wrap=$('#gridwrap'); if(!wrap||!state.user) return;
  syncHeader(); renderNotice();
  if(isEditing()){ state.pending=true; return; }        // 입력 중에는 화면 갱신 보류
  state.pending=false;
  const tab=curTab();
  if(!tab){ wrap.innerHTML=`<div class="empty">등록된 장비 탭이 없습니다. 관리자 모드에서 추가하세요.</div>`; return; }
  const st=wrap.scrollTop, sl=wrap.scrollLeft;
  const key=`${tab.id}|${state.today}|${stepOf(tab)}|${hoursFor(tab).length}`;
  if(isRoom(tab)) state.scrollKey='';                                       // 챔버형 탭을 거치면 다음에 시간표 탭을 열 때 다시 이동
  const first=state.view==='res'&&!isRoom(tab)&&state.scrollKey!==key;      // 탭을 열 때 한 번만 현재 시각으로 이동
  wrap.innerHTML = isRoom(tab) ? roomHtml(tab) : gridHtml(tab);
  if(first){ state.scrollKey=key; wrap.scrollTop=0; scrollToNow(wrap); }
  else{ wrap.scrollTop=st; wrap.scrollLeft=sl; }
  if(!isRoom(tab)) paintSel();
}

function scrollToNow(wrap){        // 현재 시각 칸이 날짜열 바로 뒤쪽에 오도록 가로 스크롤
  const th=wrap.querySelector('thead th.nowh'), co=wrap.querySelector('thead th.corner');
  if(!th||!co) return;
  const x=th.getBoundingClientRect().left-wrap.getBoundingClientRect().left+wrap.scrollLeft;
  wrap.scrollLeft=Math.max(0,x-co.offsetWidth-th.offsetWidth);
}

function gridHtml(tab){
  const step=stepOf(tab), half=step===30;
  const now=new Date(), hh=now.getHours();
  let nowH=hh<ROLL_HOUR?24+hh:hh; if(half&&now.getMinutes()>=30) nowH+=0.5;   // 새벽에는 '익일' 열이 현재 시간
  let h=`<table class="grid${half?' half':''}"><thead><tr><th class="corner">${esc(tab.name)}</th>`;
  const hours=hoursFor(tab);
  for(const hr of hours) h+=`<th class="${hr===nowH?'nowh':''}${hr===18?' split':''}${hr>=24?' nx':''}${half&&hr%1?' hh':''}">${half?halfLabel(hr):hourLabel(hr)}</th>`;
  h+='</tr></thead><tbody>';
  const base=parseYmd(state.today);
  for(let i=0;i<DAYS;i++){
    const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i), ds=ymd(d), dw=d.getDay();
    h+=`<tr class="${ds===ymd(new Date())?'today':''} ${dw===0?'sun':dw===6?'sat':''}"><th class="datec">${label(ds)}</th>`;
    let prev=null;
    for(const hr of hours){
      const r=state.res.get(`${ds}_${hr}`);
      const c=['slot']; if(hr===18)c.push('split'); if(half&&hr%1)c.push('hh'); if(isPastSlot(ds,hr,step))c.push('past');
      if(r){
        c.push('taken');
        if(r.name===REPAIR){ c.push('repair'); if(!isAdmin()) c.push('locked'); }
        else if(r.name===state.user.name) c.push('mine');
        else if(!isAdmin()) c.push('locked');
      }
      const showName=r&&!(half&&prev===r.name);     // 30분 표: 같은 사람이 이어진 칸은 첫 칸에만 이름 표시
      h+=`<td class="${c.join(' ')}" data-date="${ds}" data-hour="${hr}"${r?` title="${esc(r.name)}"`:''}>${showName?esc(r.name):''}</td>`;
      prev=r?r.name:null;
    }
    h+='</tr>';
  }
  return h+'</tbody></table>';
}

function roomHtml(tab){
  const cols=tab.cols||[], me=state.user;
  if(!cols.length) return `<div class="empty">등록된 열이 없습니다.${isAdmin()?' 관리 → 해당 탭의 "열 관리"에서 추가하세요.':' 관리자에게 문의하세요.'}</div>`;
  const R=c=>state.room.get(c.id)||{};
  const ownerOrAdmin=r=>!!r.user&&(r.user===me.name||isAdmin());
  let h=`<table class="grid room"><thead><tr><th class="corner">${esc(tab.name)}</th>${cols.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>`;
  h+='<tr><th class="datec">사용자</th>';
  for(const c of cols){
    const r=R(c), cl=['rc','ruser'];
    if(r.user){
      cl.push('taken');
      if(r.user===REPAIR) cl.push('repair'); else if(r.user===me.name) cl.push('mine');
      if(r.user!==me.name&&!isAdmin()) cl.push('locked');
    }
    h+=`<td class="${cl.join(' ')}" data-col="${esc(c.id)}">${r.user?esc(r.user):''}</td>`;
  }
  h+='</tr>';
  for(const [f,lab] of [['start','시작 시간'],['end','종료 시간']]){
    h+=`<tr><th class="datec">${lab}</th>`;
    for(const c of cols){
      const r=R(c), can=ownerOrAdmin(r);
      h+=`<td class="rc rdate${can?' editable':''}" data-col="${esc(c.id)}">${shortDate(r[f])}${can?`<input type="date" class="dateinp" data-col="${esc(c.id)}" data-f="${f}" value="${r[f]||''}">`:''}</td>`;
    }
    h+='</tr>';
  }
  h+='<tr class="rm-note"><th class="datec">비고</th>';
  for(const c of cols){
    const r=R(c), can=(r.user===me.name)||isAdmin();
    h+=`<td class="rc rnote">${can?`<textarea class="note" data-col="${esc(c.id)}">${esc(r.note||'')}</textarea>`:`<div class="ntxt">${esc(r.note||'')}</div>`}</td>`;
  }
  return h+'</tr></tbody></table>';
}

/* ---------------- 입력 처리 (클릭/드래그/날짜/메모) ---------------- */
function paintSel(){
  document.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel'));
  if(!drag) return;
  const lo=Math.min(drag.start,drag.end), hi=Math.max(drag.start,drag.end);
  for(const hr of slotRange(curTab(),lo,hi)){ const td=document.querySelector(`td.slot[data-date="${drag.date}"][data-hour="${hr}"]`); td&&td.classList.add('sel'); }
}
let gridBound=false;
const noteTimers={};
function bindGrid(){
  const wrap=$('#gridwrap');
  wrap.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    // e.target 대신 손가락 좌표로 칸을 판정 (모바일 브라우저가 터치 대상을 이웃 칸으로 보정하는 문제 방지)
    const hit=document.elementFromPoint(e.clientX,e.clientY);
    const td=hit&&hit.closest&&hit.closest('td.slot');
    if(td){
      if(td.classList.contains('locked')) return;           // 타인 예약 칸은 클릭 불가
      if(e.pointerType==='mouse'){ drag={date:td.dataset.date,start:+td.dataset.hour,end:+td.dataset.hour}; paintSel(); }
      else{                                                 // 터치: 한 칸 탭만 허용(스크롤 중 탭/손가락 이동은 무시)
        tap={kind:'slot',date:td.dataset.date,hour:td.dataset.hour,x:e.clientX,y:e.clientY,t:Date.now(),st:wrap.scrollTop,sl:wrap.scrollLeft};
        td.classList.add('sel');
      }
      return;
    }
    if(e.pointerType!=='mouse'){                            // 신뢰성방 사용자 칸 (터치)
      const ru=hit&&hit.closest&&hit.closest('td.ruser');
      if(ru&&!ru.classList.contains('locked')){
        tap={kind:'room',col:ru.dataset.col,x:e.clientX,y:e.clientY,t:Date.now(),st:wrap.scrollTop,sl:wrap.scrollLeft};
        ru.classList.add('sel');
      }
    }
  });
  wrap.addEventListener('pointermove',e=>{
    if(tap){ if(Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>10){ tap=null; clearSel(); } return; }
    if(!drag) return;
    const el=document.elementFromPoint(e.clientX,e.clientY), td=el&&el.closest&&el.closest('td.slot');
    if(td&&td.dataset.date===drag.date&&+td.dataset.hour!==drag.end){ drag.end=+td.dataset.hour; paintSel(); }
  });
  // 챔버형(신뢰성방)
  wrap.addEventListener('click',e=>{
    const inp=e.target.closest('input.dateinp');
    if(inp){ try{ inp.showPicker&&inp.showPicker(); }catch{} return; }
    const u=e.target.closest('td.ruser');
    if(u){ if(Date.now()-lastTouchTap>700&&!u.classList.contains('locked')) roomUserClick(u.dataset.col); return; }   // 터치는 pointer 방식으로 이미 처리됨
    const d=e.target.closest('td.rdate');
    if(d&&!d.classList.contains('editable')){
      const r=state.room.get(d.dataset.col);
      if(!r||!r.user) toast('먼저 사용자 칸을 눌러 예약하세요');
    }
  });
  wrap.addEventListener('change',async e=>{
    const t=e.target, tabId=state.activeTab;
    if(t.matches('input.dateinp')){
      t.blur();
      const col=t.dataset.col, f=t.dataset.f, val=t.value, r=state.room.get(col)||{};
      const other=f==='start'?r.end:r.start;
      if(val&&other&&((f==='start'&&val>other)||(f==='end'&&val<other))){ toast('종료일은 시작일보다 빠를 수 없습니다'); state.pending=false; renderGrid(); return; }
      await state.store.roomSet(tabId,col,{[f]:val}).catch(er=>toast('저장 실패: '+er.message));
    } else if(t.matches('textarea.note')){
      clearTimeout(noteTimers[t.dataset.col]);
      await state.store.roomSet(tabId,t.dataset.col,{note:t.value}).catch(er=>toast('저장 실패: '+er.message));
    }
  });
  wrap.addEventListener('input',e=>{
    const t=e.target; if(!t.matches('textarea.note')) return;
    const col=t.dataset.col, tabId=state.activeTab;
    clearTimeout(noteTimers[col]);
    noteTimers[col]=setTimeout(()=>state.store.roomSet(tabId,col,{note:t.value}).catch(()=>{}),700);
  });
  wrap.addEventListener('focusout',()=>setTimeout(()=>{ if(state.pending&&!isEditing()) renderGrid(); },120));
  if(gridBound) return; gridBound=true;
  const finish=ok=>{
    if(!drag) return; const d=drag; drag=null; paintSel();
    if(ok) commit(d.date,Math.min(d.start,d.end),Math.max(d.start,d.end));
  };
  window.addEventListener('pointerup',e=>{
    if(tap){
      const t=tap; tap=null; clearSel();
      const w=$('#gridwrap'), el=document.elementFromPoint(e.clientX,e.clientY);
      const still=!!w&&Math.hypot(e.clientX-t.x,e.clientY-t.y)<=10&&Math.abs(w.scrollTop-t.st)<=2&&Math.abs(w.scrollLeft-t.sl)<=2&&Date.now()-t.t<=800;
      if(t.kind==='room'){
        lastTouchTap=Date.now();
        const c=el&&el.closest&&el.closest('td.ruser');
        if(still&&c&&c.dataset.col===t.col) roomUserClick(t.col);
        return;
      }
      const c=el&&el.closest&&el.closest('td.slot');
      const same=!!c&&c.dataset.date===t.date&&c.dataset.hour===t.hour;
      if(same&&still) commit(t.date,+t.hour,+t.hour);
      return;
    }
    finish(true);
  });
  window.addEventListener('pointercancel',()=>{ if(tap){ tap=null; clearSel(); } finish(false); });
}

const reserveName = () => (isAdmin()&&state.repair) ? REPAIR : state.user.name;

async function commit(date,lo,hi){
  if(!state.user) return;
  verify();                       // 계정 확인은 백그라운드로 (탭 반응 지연 방지)
  const me=state.user, tabId=state.activeTab, tab=curTab(), st=stepOf(tab);
  if(lo===hi){
    const r=state.res.get(`${date}_${lo}`);
    if(r){
      if(r.name===me.name||(isAdmin()&&r.name===REPAIR)){      // 내 예약 / 수리중: 확인창 없이 즉시 삭제
        await state.store.cancel(tabId,date,lo).catch(e=>toast('삭제 실패: '+e.message));
      } else if(isAdmin()){                                   // 관리자가 타인 예약 삭제: 확인
        if(confirm(`${label(date)} ${slotText(lo,st)}\n${r.name} 님의 예약을 삭제할까요?`))
          await state.store.cancel(tabId,date,lo).catch(e=>toast('삭제 실패: '+e.message));
      }
      return;                                                 // 일반 사용자의 타인 예약 칸은 무반응
    }
    if(isPastSlot(date,lo,st)&&!isAdmin()){ toast('지난 시간은 예약할 수 없습니다'); return; }
    const q=quotaLeft(); if(q.left<q.sh-1e-9){ toast(`${q.name}은(는) 1인당 최대 ${q.limit}시간까지 예약할 수 있습니다`); return; }
    try{ await state.store.reserve(tabId,date,lo,reserveName()); }
    catch(e){ toast(e.message==='taken'?'방금 다른 사람이 예약했습니다':'저장 실패: '+e.message); }
    return;
  }
  let ok=0,skip=0,over=0; const name=reserveName(), q=quotaLeft();
  for(const hr of slotRange(tab,lo,hi)){
    if(state.res.has(`${date}_${hr}`)||(isPastSlot(date,hr,st)&&!isAdmin())){ skip++; continue; }
    if((ok+1)*q.sh>q.left+1e-9){ over++; continue; }
    try{ await state.store.reserve(tabId,date,hr,name); ok++; }catch{ skip++; }
  }
  toast(`${ok}칸 예약${(skip||over)?` (${skip+over}칸은 제외됨${over?` · 1인 한도 ${q.limit}시간`:''})`:''}`);
}

async function roomUserClick(colId){
  if(!state.user) return;
  verify();
  const me=state.user, tabId=state.activeTab, r=state.room.get(colId);
  if(r&&r.user){
    if(r.user===me.name||(isAdmin()&&r.user===REPAIR)){
      await state.store.roomRelease(tabId,colId).catch(e=>toast('해제 실패: '+e.message));
    } else if(isAdmin()){
      if(confirm(`${r.user} 님의 사용 등록을 해제할까요?\n(시작/종료일, 비고도 함께 삭제됩니다)`))
        await state.store.roomRelease(tabId,colId).catch(e=>toast('해제 실패: '+e.message));
    }
    return;
  }
  try{ await state.store.roomReserve(tabId,colId,reserveName()); }
  catch(e){ toast(e.message==='taken'?'방금 다른 사람이 등록했습니다':'저장 실패: '+e.message); }
}

  renderPanel();
}
function closePanel(){

}
function setAdmin(on){
  state.adminMode=on;
  if(!on) state.repair=false;
  if(state.user){ syncHeader(); renderTabs(); renderGrid(); renderFac(); }

}

/* ---------------- 예약 간격 변경 (1시간 ↔ 30분) ---------------- */
async function planStepDown(tab){      // 정각 칸이 비어 있으면 30분 예약을 올리고(move), 이미 예약돼 있으면 삭제(del)
  const list=await state.store.listRes(tab.id,state.today);
  const has=new Set(list.map(r=>`${r.date}_${r.hour}`));
  const plan={tab,del:[],move:[]};
  list.filter(r=>r.hour%1!==0).sort((a,b)=>a.date===b.date?a.hour-b.hour:(a.date<b.date?-1:1)).forEach(r=>{
    (has.has(`${r.date}_${Math.floor(r.hour)}`)?plan.del:plan.move).push({date:r.date,hour:r.hour,name:r.name});
  });
  return plan;
}
function askStepDown(plans){
  return new Promise(resolve=>{
    const m=$('#modal'), nDel=plans.reduce((s,p)=>s+p.del.length,0), nMove=plans.reduce((s,p)=>s+p.move.length,0);
    const line=r=>`<div class="cr">${shortDate(r.date)} ${slotText(r.hour,30)} · ${esc(r.name)}</div>`;
    const body=plans.filter(p=>p.del.length||p.move.length).map(p=>`<div class="ch"><b>${esc(p.tab.name)}</b>
      ${p.del.length?`<div class="cl dl">삭제 ${p.del.length}건</div>${p.del.map(line).join('')}`:''}
      ${p.move.length?`<div class="cl">정각 칸으로 올림 ${p.move.length}건</div>${p.move.map(line).join('')}`:''}</div>`).join('');
    m.innerHTML=`<div class="mbox"><div class="mhead"><b style="font-size:16px">1시간 단위로 변경</b><button id="mclose">✕</button></div>
      <p style="font-size:15px;line-height:1.6;margin:6px 0"><b>삭제될 예약 ${nDel}건</b>${nMove?` · 정각 칸으로 올라갈 예약 ${nMove}건`:''}</p>
      <p class="note">정각 칸(예: 12:00)에 예약이 있으면 뒤의 30분 칸(12:30)은 삭제되고, 정각 칸이 비어 있으면 30분 예약이 정각 칸으로 올라갑니다. 삭제된 예약은 되돌릴 수 없습니다.</p>
      <div class="chglist">${body}</div>
      <div class="row"><button id="stOk">변경하기</button><button id="stNo" style="background:#fff;color:#2a3166">취소</button></div></div>`;
    m.classList.add('open');
    const done=ok=>{ m.onclick=e=>{ if(e.target===m) closePanel(); }; if(state.panelOpen&&isAdmin()) renderPanel(); else m.classList.remove('open'); resolve(ok); };
    $('#stOk').onclick=()=>done(true); $('#stNo').onclick=()=>done(false); $('#mclose').onclick=()=>done(false);
    m.onclick=e=>{ if(e.target===m) done(false); };
  });
}
async function changeSteps(ids,step){
  const tabs=ids.map(id=>state.tabs.find(t=>t.id===id)).filter(t=>t&&!isRoom(t)&&stepOf(t)!==step);
  if(!tabs.length){ toast('이미 같은 간격입니다'); renderTabList(); return; }
  try{
    if(step===30){
      for(const t of tabs) await state.store.setTabStep(t.id,30);
      toast(`${tabs.length}개 탭을 30분 간격으로 바꿨습니다`); return;
    }
    const plans=[]; for(const t of tabs) plans.push(await planStepDown(t));
    if(plans.some(p=>p.del.length||p.move.length)){
      if(!(await askStepDown(plans))){ renderTabList(); return; }
    }
    for(const p of plans) await state.store.applyStepDown(p.tab.id,p);
    toast(`${tabs.length}개 탭을 1시간 간격으로 바꿨습니다`);
  }catch(e){ toast('변경 실패: '+e.message); renderTabList(); }
}

  if(v==='res'&&wrap&&state.savedScroll){ wrap.scrollLeft=state.savedScroll.l; wrap.scrollTop=state.savedScroll.t; }
  renderVTabs(); renderNotice(); renderLowBar(); renderFac();
  if(v==='res') renderGrid();
}
const lowList = () => state.fac.filter(x=>x.low);
function renderVTabs(){

function renderFac(){

function facClick(e){
  const b=e.target.closest('button[data-low]'); if(b){ toggleLow(b.dataset.low); return; }
  if(e.target.closest('#facAdd')){ openFacEditor(null); return; }
  const c=e.target.closest('[data-edit]'); if(c&&isAdmin()) openFacEditor(c.dataset.edit);
}
let facBusy=false;
async function toggleLow(id){       // 한 번 누르면 알림, 다시 누르면 해제 (서버 값을 기준으로 뒤집으므로 동시에 눌러도 1회씩만 반영)
  if(facBusy||!state.user) return;
  facBusy=true;
  try{ await state.store.facTx(items=>{ const it=items.find(x=>x.id===id); if(it) it.low=!it.low; return items; }); }
  catch(e){ toast('저장 실패: '+e.message); }
  finally{ setTimeout(()=>{ facBusy=false; },400); }
}
function openFacEditor(id){
  if(!isAdmin()) return;

    <label class="nlab">장비 이름</label><input class="fi" id="fnName" maxlength="30" value="${it?esc(it.name):''}">
    <label class="nlab">담당자 (정)</label><input class="fi" id="fnM1" maxlength="20" value="${it?esc(it.m1||''):''}">
    <label class="nlab">담당자 (부) — 없으면 비워 두세요</label><input class="fi" id="fnM2" maxlength="20" value="${it?esc(it.m2||''):''}">
    <div class="row"><button id="fnSave">저장</button>${it?`<button id="fnUp" style="background:#fff;color:#2a3166">▲ 위로</button><button id="fnDown" style="background:#fff;color:#2a3166">▼ 아래로</button><button id="fnDel" style="background:#fff;color:#c62828;border-color:#efc3c3">삭제</button>`:''}</div></div>`;
  m.classList.add('open');
  const close=()=>m.classList.remove('open');
  $('#mclose').onclick=close; m.onclick=e=>{ if(e.target===m) close(); };

    const name=$('#fnName').value.trim(), m1=$('#fnM1').value.trim(), m2=$('#fnM2').value.trim();

      await state.store.facTx(items=>{
        if(it){ const x=items.find(v=>v.id===it.id); if(x){ x.name=name; x.m1=m1; x.m2=m2; } }
        else items.push({id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,m1,m2,low:false});
        return items;
      });
      close(); toast(it?'저장했습니다':'장비를 추가했습니다');
    }catch(e){ toast('저장 실패: '+e.message); }
  };
  if(!it) return;
  const move=async d=>{
    try{ await state.store.facTx(items=>{ const i=items.findIndex(v=>v.id===it.id), j=i+d; if(i<0||j<0||j>=items.length) return items; [items[i],items[j]]=[items[j],items[i]]; return items; }); }
    catch(e){ toast('이동 실패: '+e.message); }
  };
  $('#fnUp').onclick=()=>move(-1); $('#fnDown').onclick=()=>move(1);

    if(!confirm(`"${it.name}" 장비를 목록에서 삭제할까요?`)) return;

    catch(e){ toast('삭제 실패: '+e.message); }
  };
}

/* ---------------- 시간 흐름: 자정에 날짜 자동 이동 ---------------- */
function tick(){
  if(!state.user) return;
  const t=bizToday(), h=slotTick();
  if(t!==state.today){ state.today=t; state.hour=h; state.subKey=''; subscribeRes(); renderGrid(); }   // 맨 윗줄 제거, 아래 줄이 올라옴
  else if(h!==state.hour){ state.hour=h; renderGrid(); }          // 30분마다 '지난 시간' 표시 갱신
}
setInterval(tick,15000);
window.addEventListener('focus',()=>{ if(state.user) verify(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&state.user){ state.hour=-1; tick(); } });

  const close=openInfo('공지 수정',`<label class="nlab">전체 공지 (모든 장비 화면 상단에 표시)</label>
    <textarea id="ntG" rows="3" maxlength="300">${esc(state.notice||'')}</textarea>
    ${tab?`<label class="nlab">${esc(tab.name)} 공지 (이 장비 탭에서만 표시)</label><textarea id="ntT" rows="3" maxlength="300">${esc(tab.notice||'')}</textarea>`:''}
    <div class="row"><button id="ntSave">저장</button><button id="ntClear" style="background:#fff;color:#c62828;border-color:#efc3c3">모두 지우기</button></div>
    <p class="note">내용을 비우고 저장하면 해당 공지가 사라집니다.</p>`);
  $('#ntSave').onclick=async()=>{
    try{
      await state.store.setNotice($('#ntG').value.trim());
      if(tab) await state.store.setTabNotice(tab.id,$('#ntT').value.trim());
      toast('공지를 저장했습니다'); close();
    }catch(e){ toast('저장 실패: '+e.message); }
  };
  $('#ntClear').onclick=async()=>{
    try{ await state.store.setNotice(''); if(tab) await state.store.setTabNotice(tab.id,''); toast('공지를 지웠습니다'); close(); }
    catch(e){ toast('저장 실패: '+e.message); }
  };
}

/* ---------------- 홈 화면 추가 / 바로가기 ---------------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; const b=$('#btnInstall'); if(b) b.remove(); });
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isMobileDev=()=>/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||isIOS()||matchMedia('(pointer:coarse)').matches;
const installBtnHtml=()=>isStandalone()?'':(isMobileDev()?'<button class="hbtn" id="btnInstall" data-k="m">홈화면</button>':'<button class="hbtn" id="btnInstall" data-k="p">바로가기</button>');
function openInfo(title,html){
  const m=$('#modal'); m.innerHTML=`<div class="mbox"><div class="mhead"><b style="font-size:16px">${title}</b><button id="mclose">✕</button></div>${html}</div>`;
  m.classList.add('open'); const close=()=>m.classList.remove('open');
  $('#mclose').onclick=close; m.onclick=e=>{ if(e.target===m) close(); }; return close;
}
async function onInstall(kind){
  if(kind==='m'){
    const ua=navigator.userAgent, app=/KAKAOTALK/i.test(ua)?'카카오톡':/NAVER\(inapp/i.test(ua)?'네이버 앱':/DaumApps/i.test(ua)?'다음 앱':/Instagram/i.test(ua)?'인스타그램':/FBAN|FBAV/i.test(ua)?'페이스북':/Line\//i.test(ua)?'라인':'';
    if(app){
      const href=location.href.split('#')[0], u=new URL(href), android=/Android/i.test(ua), kakao=app==='카카오톡';
      const ext = kakao ? 'kakaotalk://web/openExternal?url='+encodeURIComponent(href)
        : android ? 'intent://'+u.host+u.pathname+u.search+'#Intent;scheme='+u.protocol.replace(':','')+';package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(href)+';end'
        : '';
      openInfo('외부 브라우저로 열어 주세요',`<p style="font-size:14px;line-height:1.6;margin:6px 0">지금은 <b>${app}</b> 안에서 열려 있어 홈 화면에 추가할 수 없습니다.</p>
        <div class="row" style="margin-top:4px">${ext?`<button id="exOpen" data-url="${esc(ext)}">기본 브라우저로 열기</button>`:''}<button id="exCopy" style="background:#fff;color:#2a3166">주소 복사</button></div>
        <p class="note" style="margin-top:10px">버튼이 동작하지 않으면 아래 순서로 열어 주세요.</p>
        <ol><li>화면의 <b>메뉴(⋮ 또는 ≡)</b>를 누릅니다</li><li><b>'다른 브라우저로 열기'</b>(또는 '기본 브라우저로 열기', 'Safari로 열기')를 누릅니다</li><li>열린 ${isIOS()?'Safari':'Chrome'}에서 <b>홈화면</b> 버튼을 다시 누릅니다</li></ol>
        ${ext?'':'<p class="note">아이폰의 이 앱에서는 자동으로 열 수 없습니다. 메뉴를 이용하거나, 주소를 복사해 Safari 주소창에 붙여넣어 주세요.</p>'}`);
      if(ext) $('#exOpen').onclick=()=>{ location.href=$('#exOpen').dataset.url; };
      $('#exCopy').onclick=async()=>{
        let ok=false;
        try{ await navigator.clipboard.writeText(href); ok=true; }
        catch{ const ta=document.createElement('textarea'); ta.value=href; document.body.appendChild(ta); ta.select(); try{ ok=document.execCommand('copy'); }catch{} ta.remove(); }
        toast(ok?'주소를 복사했습니다. 브라우저 주소창에 붙여넣으세요':'복사하지 못했습니다');
      };
      return;
    }
    const ios=isIOS(), sam=/SamsungBrowser/i.test(ua);
    const steps = ios
      ? `<ol><li>반드시 <b>Safari</b>로 이 페이지를 엽니다 (카카오톡·네이버 앱 안에서는 안 됩니다)</li><li>화면 아래(또는 위)의 <b>공유 버튼</b>(네모에 화살표)을 누릅니다</li><li><b>'홈 화면에 추가'</b>를 누르고 오른쪽 위 <b>추가</b>를 누릅니다</li></ol><p class="note">홈 화면 아이콘으로 처음 열면 로그인을 한 번 다시 해야 할 수 있습니다.</p>`
      : sam
      ? `<ol><li>화면 아래의 <b>≡ 메뉴</b>를 누릅니다</li><li><b>앱 설치</b>(또는 <b>현재 페이지 추가 → 홈 화면</b>)를 누릅니다</li><li><b>추가</b>를 누릅니다</li></ol>`
      : `<ol><li><b>Chrome</b>으로 이 페이지를 엽니다 (카카오톡·네이버 앱 안에서는 안 됩니다)</li><li>오른쪽 위 <b>⋮ 메뉴</b>를 누릅니다</li><li><b>'앱 설치'</b>(또는 <b>'홈 화면에 추가'</b>)를 누르고 <b>설치/추가</b>를 누릅니다</li></ol>`;
    const close=openInfo('홈 화면에 추가',`${ios?'':'<div class="row" style="margin-top:4px"><button id="appInst">앱 설치</button></div><p class="note" style="margin-top:6px">홈 화면에 앱 아이콘으로 설치됩니다.</p><p class="note" style="margin-top:10px">버튼이 동작하지 않으면 아래 순서로 추가해 주세요.</p>'}${steps}`);
    if(!ios) $('#appInst').onclick=async()=>{
      if(!deferredPrompt){ toast('이 브라우저에서는 아래 순서대로 메뉴에서 설치해 주세요'); return; }
      const p=deferredPrompt; deferredPrompt=null; p.prompt();
      const r=await p.userChoice.catch(()=>null);
      if(r&&r.outcome==='accepted'){ toast('홈 화면에 추가했습니다'); close(); }
    };
    return;
  }
  const plat=/Mac/i.test(navigator.platform)?'mac':/Win/i.test(navigator.platform)?'win':'linux';
  const ext={win:'url',mac:'webloc',linux:'desktop'}[plat];
  const close=openInfo('바로가기 만들기',
    `<div class="row" style="margin-top:4px"><button id="scFile">바로가기 파일 받기 (.html)</button><button id="scApp">앱 설치</button></div>
     <ol><li><b>바로가기 파일 받기</b>: 내려받은 파일을 <b>바탕화면</b>으로 옮기면, 더블클릭할 때 기본 브라우저에서 이 페이지가 열립니다.</li><li><b>앱 설치</b>: 앱 아이콘이 바탕화면·시작 메뉴에 생기고 별도 창으로 열립니다. (Chrome·Edge)</li></ol><p class="note">아이콘이 있는 바로가기가 필요하면 Chrome·Edge 메뉴(⋮) → 저장 및 공유 → <b>바로가기 만들기</b>를 이용하세요. ("창으로 열기"는 끄면 일반 브라우저로 열립니다)</p>`);
  $('#scFile').onclick=()=>downloadShortcut();
  $('#scApp').onclick=async()=>{
    if(!deferredPrompt){ toast('주소창 오른쪽의 설치 아이콘 또는 ⋮ 메뉴 → 저장 및 공유 → 앱 설치를 이용해 주세요'); return; }
    const p=deferredPrompt; deferredPrompt=null; p.prompt();
    const r=await p.userChoice.catch(()=>null);
    if(r&&r.outcome==='accepted'){ toast('앱을 설치했습니다'); close(); }
  };
}
function downloadShortcut(){
  // 어느 PC에서나 더블클릭하면 기본 브라우저가 열려 이 주소로 이동하는 바로가기(.html) 파일
  const url=location.href.split('#')[0], name='APIC 장비예약';
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>${name}</title><meta http-equiv="refresh" content="0;url=${esc(url)}"><script>location.replace(${JSON.stringify(url)});<\/script></head><body style="font-family:sans-serif;padding:24px"><p>${name} 페이지로 이동합니다…</p><p><a href="${esc(url)}">자동으로 열리지 않으면 여기를 누르세요</a></p></body></html>`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  a.download='APIC_Reservation.html';             // 한글 파일 이름은 일부 브라우저에서 이름이 사라지므로 영문 사용
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('바로가기 파일을 받았습니다. 바탕화면으로 옮겨 사용하세요');
}

/* ---------------- 시작 ---------------- */
(async function boot(){
  try{ state.store = USE_FIREBASE ? await makeFirebaseStore() : makeLocalStore(); }
  catch(e){ $('#app').innerHTML=`<div class="empty">Firebase 연결 실패: ${esc(e.message)}</div>`; return; }
  state.store.watchTabs(onTabs);
  state.store.watchNotice(t=>{ state.notice=t||''; renderNotice(); });
  state.store.watchFac(list=>{ state.fac=list||[]; renderVTabs(); renderLowBar(); renderFac(); });
  let sess=null; try{ sess=JSON.parse(localStorage.getItem(SESS)||'null'); }catch{}
  if(sess){
    try{
      const u=await state.store.getUser(sess.name);
      if(u&&u.pinHash===sess.hash){ state.user=u; state.adminMode=!!u.admin; startApp(); return; }
    }catch{}
    localStorage.removeItem(SESS);
  }
  showLogin();
})();
</script>
